include hyde.conf

# Minimal Tab bar styling 
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

# ---- Keyboard text selection (no mouse) ----
# The hints kitten selects screen text with the keyboard. --program @ copies
# the match to the clipboard, which is what the grammar-fix scripts read.
map ctrl+shift+semicolon  kitten hints --type line --program @
map ctrl+shift+o          kitten hints --type word --program @
map ctrl+shift+p          kitten hints --type path --program @
map ctrl+shift+y          kitten hints --type url --program @

# Open scrollback in the pager for full keyboard navigation and selection.
map ctrl+shift+h          show_scrollback
